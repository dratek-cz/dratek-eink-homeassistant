name: Validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Python and frontend syntax
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check JavaScript syntax
        run: |
          node --check custom_components/dratek_eink/frontend/dratek-eink-panel.js
          node --check custom_components/dratek_eink/frontend/dratek-eink-overview-card.js

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/dratek-eink-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build ESP32 firmware
        run: pio run -e esp32dev -e esp32-s3-devkitc-1
